<main id="main">
  <!-- PAGE HERO -->
  <div class="page-hero">
    <div class="wrap ph-in">
      <nav class="crumbs" aria-label="breadcrumb"><a href="index.html" data-t="home"></a><span aria-hidden="true">/</span><span data-t="aboutCrumb"></span></nav>
      <h1 data-t="aboutTitle"></h1>
      <p class="lead" data-t="aboutLead"></p>
    </div>
  </div>

  <!-- MISSION: what we are / what we are not -->
  <section class="mission-sec">
    <div class="wrap mission-grid">
      <article class="mission rv">
        <h2 data-t="roleTitle"></h2>
        <p class="mission-big" data-t="role1"></p>
        <p data-t="role2"></p>
      </article>
      <article class="isnot rv">
        <h2 data-t="notTitle"></h2>
        <ul class="isnot-list" id="notList"></ul>
      </article>
    </div>
  </section>

  <!-- TEAM -->
  <section class="team-sec">
    <div class="wrap">
      <div class="sec-head rv">
        <h2 data-t="teamTitle"></h2>
      </div>
      <div class="lead-person rv">
        <div class="house-photo"><img src="assets/team-mar.jpg" alt="Már Wolfgang Mixa" width="640" height="800"></div>
        <div class="lp-text">
          <span class="role-tag" data-t="marRole"></span>
          <h3>Már Wolfgang Mixa</h3>
          <p data-t="marBio"></p>
        </div>
      </div>
      <div class="people">
        <div class="person rv">
          <div class="house-photo"><img src="assets/team-valdis.jpg" alt="Valdís Björt Guðmundsdóttir" width="320" height="400"></div>
          <h3>Valdís Björt Guðmundsdóttir</h3>
          <span class="role-tag" data-t="valdisRole"></span>
        </div>
        <div class="person rv">
          <div class="house-photo"><img src="assets/team-styrmir.jpg" alt="Styrmir Þór Hauksson" width="640" height="800"></div>
          <h3>Styrmir Þór Hauksson</h3>
          <span class="role-tag" data-t="styrmirRole"></span>
        </div>
      </div>
    </div>
  </section>

  <!-- PRINCIPLES -->
  <section class="principles-sec">
    <div class="wrap principles">
      <article class="principle rv">
        <div class="card-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg></div>
        <h2 data-t="editTitle"></h2>
        <p data-t="editText"></p>
      </article>
      <article class="principle rv">
        <div class="card-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5.5" rx="7.5" ry="2.8"/><path d="M4.5 5.5v6c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8v-6"/><path d="M4.5 11.5v6c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8v-6"/></svg></div>
        <h2 data-t="srcTitle"></h2>
        <p data-t="srcText"></p>
        <ul class="chips"><li>HMS</li><li>Hagstofa Íslands</li><li>Seðlabanki Íslands</li><li>Fasteignaskrá</li></ul>
      </article>
    </div>
  </section>

</main>
