  role2:"Samt eru upplýsingarnar oft dreifðar, flóknar eða litaðar af söluhagsmunum. Húsnæði.is safnar þeim saman á einn stað og setur fram á skýru, hlutlausu máli. Vettvangurinn tengist akademísku starfi og byggir á opinberum gögnum og rannsóknum. Hér eru engar söluræður, engin lánatilboð og engin auglýst kjör. Aðeins fræðsla, gögn og heimildir.",
